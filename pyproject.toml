[project]
name = "mcp-turkish-nlp-tools"
version = "0.1.0"
description = "MCP server exposing Turkish NLP classifiers (BERTurk project) as tools."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Serpil Umay" }]
dependencies = [
    "mcp>=2.3.0,<3",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
]

[project.optional-dependencies]
# Model backends are added in a later stage (Aşama 4); declared empty for now.

[project.scripts]
tcmcp = "tcmcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tcmcp"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "T20"]
allowed-confusables = ["ı", "İ"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not slow'"
markers = ["slow: needs real model artefacts or network; skipped by default"]
